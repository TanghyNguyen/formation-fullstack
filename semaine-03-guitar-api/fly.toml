app = "semaine-03-guitar-api"
primary_region = "cdg"

[build]

[env]
  AI_PROVIDER = "groq"
  GROQ_MODEL = "qwen/qwen3.8-27b"
  OPENAI_FALLBACK = "true"
  PROGRESSIONS_CACHE = "true"
  PROGRESSIONS_CACHE_TTL = "3600"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
